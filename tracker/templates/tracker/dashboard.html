<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CodeSoft | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-warm: #fdfbf7;
            --accent-clay: #e67e22;
            --text-dark: #2d3436;
        }

        body { background-color: var(--bg-warm); font-family: 'Segoe UI', sans-serif; }
        
        /* Sidebar Styling */
        .sidebar { 
            height: 100vh; 
            background: #ffffff; 
            color: var(--text-dark); 
            padding-top: 20px; 
            position: fixed; 
            width: 260px;
            border-right: 1px solid #eee;
        }

        .main-content { margin-left: 280px; padding: 40px; }

        /* Branding */
        .brand-name {
            color: var(--accent-clay);
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -1px;
        }

        /* Hover Glow Effect */
        .project-card {
            transition: all 0.3s ease;
            border: 1px solid #eee;
            border-radius: 16px;
            background: white;
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-color: var(--accent-clay);
        }

        .nav-link { color: #636e72; padding: 12px 25px; border-radius: 10px; margin: 5px 15px; transition: 0.2s; }
        .nav-link:hover { background: #f8f9fa; color: var(--accent-clay); }
        .nav-link.active { background: var(--bg-warm); color: var(--accent-clay); font-weight: 600; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="text-center mb-4">
        <span class="brand-name">CodeSoft</span>
        <p class="text-muted small">Work Management</p>
    </div>
    <nav class="nav flex-column">
        <a href="{% url 'dashboard' %}" class="nav-link active"><i class="fas fa-th-large me-2"></i> Dashboard</a>
        <a href="{% url 'index' %}" class="nav-link"><i class="fas fa-home me-2"></i> Landing Page</a>
        <hr class="mx-3">
        <a href="{% url 'logout' %}" class="nav-link text-danger"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
    </nav>
</div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold m-0">Employee Workspace</h2>
        <div class="input-group" style="max-width: 300px;">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="fas fa-search"></i></span>
            <input type="text" id="taskSearch" class="form-control border-start-0" placeholder="Filter tasks..." onkeyup="filterTasks()">
        </div>
    </div>

    <div id="projectList">
        {% for project in projects %}
        <div class="card project-card mb-4 shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h4 class="fw-bold mb-1 project-title">{{ project.title }}</h4>
                        <p class="text-muted small mb-3">{{ project.description }}</p>
                    </div>
                    <span class="badge bg-light text-success rounded-pill px-3 py-2 border">Active</span>
                </div>
                
                <div class="progress mb-3" style="height: 6px; border-radius: 10px;">
                    <div class="progress-bar bg-success" style="width: 75%"></div>
                </div>

                <div class="task-list">
                    {% for task in project.tasks.all %}
                    <div class="d-flex align-items-center py-2 border-bottom-dashed">
                        <i class="far fa-circle text-muted me-3"></i>
                        <span class="small">{{ task.title }}</span>
                        <span class="ms-auto badge bg-light text-dark small border">{{ task.assigned_to.username }}</span>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    function filterTasks() {
        let input = document.getElementById('taskSearch').value.toLowerCase();
        let cards = document.querySelectorAll('.project-card');
        cards.forEach(card => {
            let title = card.querySelector('.project-title').innerText.toLowerCase();
            card.style.display = title.includes(input) ? "" : "none";
        });
    }
</script>

</body>
</html>
