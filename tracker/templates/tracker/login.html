{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CodeSoft | Login</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            background-color: #fdfbf7; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .auth-wrapper {
            display: flex;
            justify-content: center; 
            align-items: center;    
            height: 100vh;          
        }

        .auth-box {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid #eee;
        }

        h2 {
            color: #e67e22; 
            margin-bottom: 25px;
            font-weight: 800;
        }

        /* FIX: Ensures Django labels and inputs are stacked correctly */
        form p {
            text-align: left;
            margin-bottom: 15px;
        }

        /* FIX: Targets Django-generated inputs specifically */
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box; 
            display: block;
        }

        .btn-signin {
            width: 100%;
            padding: 12px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }

        .btn-signin:hover {
            background: #d35400;
        }

        /* Error Message Styling */
        .errorlist {
            color: #d63031;
            list-style: none;
            padding: 0;
            font-size: 0.85em;
            text-align: left;
        }

        .signup-link {
            display: block;
            margin-top: 20px;
            color: #636e72;
            text-decoration: none;
            font-size: 0.9em;
        }

        .signup-link strong {
            color: #e67e22;
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-box">
        <h2>CodeSoft Login</h2>
        
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            
            {% if form.errors %}
                <p class="errorlist">Invalid username or password. Please try again.</p>
            {% endif %}

            {{ form.as_p }}
            <button type="submit" class="btn-signin">Sign In</button>
        </form>
        
        <a href="{% url 'signup' %}" class="signup-link">
            New member? <strong>Create an Account</strong>
        </a>
    </div>
</div>

</body>
</html>
