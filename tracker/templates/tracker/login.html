{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>CodeSoft | Login</title>
    <style>
        /* This is the magic that centers everything */
        body, html {
            height: 100%;
            margin: 0;
            background-color: #fdfbf7; /* CodeSoft Cream */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .auth-wrapper {
            display: flex;
            justify-content: center; /* Centers horizontally */
            align-items: center;     /* Centers vertically */
            height: 100vh;           /* Full viewport height */
        }

        .auth-box {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid #eee;
        }

        h2 {
            color: #e67e22; /* CodeSoft Clay Orange */
            margin-bottom: 25px;
            font-weight: 800;
        }

        form p {
            text-align: left; /* Keeps labels aligned left */
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box; /* Ensures padding doesn't break width */
        }

        .btn-signin {
            width: 100%;
            padding: 12px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-signin:hover {
            background: #d35400;
        }

        .signup-link {
            display: block;
            margin-top: 20px;
            color: #636e72;
            text-decoration: none;
            font-size: 0.9em;
        }

        .signup-link strong {
            color: #e67e22;
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-box">
        <h2>CodeSoft Login</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-signin">Sign In</button>
        </form>
        
        <a href="{% url 'signup' %}" class="signup-link">
            New member? <strong>Create an Account</strong>
        </a>
    </div>
</div>

</body>
</html>
