{% extends "tracker/base.html" %}

{% block content %}

<div class="card" style="max-width:700px;">

    <h2 style="margin-bottom:20px;">
        Edit Task
    </h2>

    <form method="POST">

        {% csrf_token %}

        <label>Task Title</label>

        <input
            type="text"
            name="title"
            value="{{ task.title }}"
            required
        >

        <label>Description</label>

        <textarea
            name="description"
            rows="5"
            required
        >{{ task.description }}</textarea>

        <label>Priority</label>

        <select name="priority">

            <option value="Low"
                {% if task.priority == 'Low' %}selected{% endif %}>
                Low
            </option>

            <option value="Medium"
                {% if task.priority == 'Medium' %}selected{% endif %}>
                Medium
            </option>

            <option value="High"
                {% if task.priority == 'High' %}selected{% endif %}>
                High
            </option>

        </select>

        <label>Status</label>

        <select name="status">

            <option value="Pending"
                {% if task.status == 'Pending' %}selected{% endif %}>
                Pending
            </option>

            <option value="In Progress"
                {% if task.status == 'In Progress' %}selected{% endif %}>
                In Progress
            </option>

            <option value="Completed"
                {% if task.status == 'Completed' %}selected{% endif %}>
                Completed
            </option>

        </select>

        <label>Deadline</label>

        <input
            type="date"
            name="deadline"
            value="{{ task.deadline|date:'Y-m-d' }}"
        >

        <button type="submit">
            Save Changes
        </button>

    </form>

</div>

{% endblock %}
