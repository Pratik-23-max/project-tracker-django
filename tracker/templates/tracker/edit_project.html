{% extends "tracker/base.html" %}

{% block content %}

<div class="card" style="max-width:700px;">

    <h2 style="margin-bottom:20px;">
        Edit Project
    </h2>
{% if errors %}

<div style="
background:#7f1d1d;
color:white;
padding:15px;
border-radius:10px;
margin-bottom:20px;
">

    {% for field, messages in errors.items %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endfor %}

</div>

{% endif %}
    <form method="POST">

        {% csrf_token %}

        <label>Project Title</label>

        <input
            type="text"
            name="title"
            value="{{ project.title }}"
            required
        >

        <label>Description</label>

        <textarea
            name="description"
            rows="5"
            required
        >{{ project.description }}</textarea>

        <button type="submit">
            Save Changes
        </button>

    </form>

</div>

{% endblock %}
