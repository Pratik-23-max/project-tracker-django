{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="auth-container-wrapper" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1a1a2e; margin: 0; padding: 1rem; box-sizing: border-box;">
    <div class="portal-selection-card" style="background: #222242; padding: 3rem 2.5rem; border-radius: 16px; box-shadow: 0 12px 32px rgba(0,0,0,0.4); width: 100%; max-width: 440px; text-align: center; border: 1px solid rgba(255,255,255,0.05);">
        
        <div style="margin-bottom: 2rem;">
            <span style="background: rgba(233, 69, 96, 0.1); color: #e94560; padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.8rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;">
                Agile Project Tracker
            </span>
            <h2 style="color: #ffffff; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 1rem 0 0.5rem 0; font-weight: 600; font-size: 1.8rem;">
                Select Workspace Portal
            </h2>
            <p style="color: #a0a0b8; font-size: 0.95rem; margin: 0;">
                Choose your access level to manage your sprints and updates.
            </p>
        </div>
        
        <div class="selection-options-wrapper" style="display: flex; flex-direction: column; gap: 1.25rem;">
            
            <a href="{% url 'login' %}?role=manager" class="portal-btn manager-choice" style="display: block; padding: 1.25rem; border-radius: 10px; background: #e94560; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 1.1rem; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid #e94560; box-shadow: 0 4px 14px rgba(233, 69, 96, 0.3);">
                <div style="display: flex; align-items: center; justify-content: center; gap: 0.75rem;">
                    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <polyline points="17 11 19 13 23 9"></polyline>
                    </svg>
                    Manager Portal
                </div>
            </a>
            
            <a href="{% url 'login' %}?role=employee" class="portal-btn employee-choice" style="display: block; padding: 1.25rem; border-radius: 10px; background: transparent; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 1.1rem; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid rgba(255,255,255,0.15);">
                <div style="display: flex; align-items: center; justify-content: center; gap: 0.75rem;">
                    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                    </svg>
                    Employee Portal
                </div>
            </a>
        </div>
        
    </div>
</div>

<style>
    /* CSS Pseudo-classes for smooth matching UI interaction states */
    .portal-btn:hover {
        transform: translateY(-2px);
    }
    .manager-choice:hover {
        background: #ff5270 !important;
        border-color: #ff5270 !important;
        box-shadow: 0 6px 20px rgba(233, 69, 96, 0.5) !important;
    }
    .employee-choice:hover {
        background: rgba(255, 255, 255, 0.04) !important;
        border-color: #e94560 !important;
        color: #e94560 !important;
    }
</style>
{% endblock %}
