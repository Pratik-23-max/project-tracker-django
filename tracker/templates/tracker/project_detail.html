{% extends 'tracker/dashboard.html' %}
{% block content %}
<div class="container mt-4">
    <h2>{{ project.title }}</h2>
    <p>{{ project.description }}</p>
    <hr>
    <h4>Assigned Tasks</h4>
    {% for task in project.tasks.all %}
        <div class="card mb-2">
            <div class="card-body">{{ task.title }} - <strong>{{ task.status }}</strong></div>
        </div>
    {% endfor %}
</div>
{% endblock %}
