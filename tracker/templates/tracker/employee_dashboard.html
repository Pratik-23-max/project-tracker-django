<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CodeSoft | Employee Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #fdfbf7; font-family: 'Segoe UI', sans-serif; }
        .user-header { color: #000000 !important; font-weight: 600; }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
        .status-todo { background: #fee2e2; color: #dc2626; }
        .status-in_progress { background: #fef9c3; color: #854d0e; }
        .status-done { background: #dcfce7; color: #166534; }
        .btn-update { background: #1d4ed8; color: white; border-radius: 6px; text-decoration: none; padding: 8px 16px; transition: 0.2s; }
        .btn-update:hover { background: #1d4ed8; color: white; }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Welcome, <span style="color: #2563eb;">{{ request.user.username }}</span></h2>
        <div class="user-header">
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-dark rounded-pill">Logout</button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0 bg-white">
        <table class="table mb-0">
            <thead class="table-light">
                <tr>
                    <th>Project</th>
                    <th>Task</th>
                    <th>Status</th>
                    <th class="text-center">Action</th>
                </tr>
            </thead>
            <tbody>
                {% for task in tasks %}
                <tr>
                    <td><strong>{{ task.project.title }}</strong></td>
                    <td>{{ task.title }}</td>
                    <td>
                        <span class="status-badge status-{{ task.status|lower }}">
                            {{ task.get_status_display }}
                        </span>
                    </td>
                    <td class="text-center">
                        <a href="{% url 'update_task_status' task.id %}" class="btn-update">Update</a>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="4" class="text-center py-5">No tasks assigned yet. ☕</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
