{% extends 'base.html' %}

{% block content %}
<div class="update-container">
    <div class="card">
        <h2>Update Task Status</h2>
        <p><strong>Task:</strong> {{ task.title }}</p>
        <p><strong>Project:</strong> {{ task.project.title }}</p>

        <form method="POST" class="update-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="status">Select New Status:</label>
                <select name="status" id="status" class="form-control">
                    {% for value, display in task.STATUS_CHOICES %}
                        <option value="{{ value }}" {% if task.status == value %}selected{% endif %}>
                            {{ display }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-save">Save Changes</button>
                <a href="{% url 'employee_dashboard' %}" class="btn-cancel">Back to Dashboard</a>
            </div>
        </form>
    </div>
</div>

<style>
    .update-container { display: flex; justify-content: center; padding: 50px 20px; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
    .form-group { margin: 20px 0; }
    .form-control { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #ddd; font-size: 1rem; }
    .button-group { display: flex; gap: 10px; margin-top: 20px; }
    .btn-save { background: #166534; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; flex: 1; font-weight: 600; }
    .btn-cancel { background: #64748b; color: white; text-decoration: none; padding: 12px 20px; border-radius: 6px; flex: 1; text-align: center; }
</style>
{% endblock %}
