<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CodeSoft | Update Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #fdfbf7; font-family: 'Segoe UI', sans-serif; }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Update Task Status</h4>
                </div>
                <div class="card-body">
                    <p><strong>Task:</strong> {{ task.title }}</p>
                    <p><strong>Project:</strong> {{ task.project.title }}</p>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="status" class="form-label">Select New Status:</label>
                            <select name="status" id="status" class="form-select">
                                {% for value, display in task.STATUS_CHOICES %}
                                    <option value="{{ value }}" {% if task.status == value %}selected{% endif %}>
                                        {{ display }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success flex-fill">Save Changes</button>
                            <a href="{% url 'employee_dashboard' %}" class="btn btn-secondary flex-fill">Back to Dashboard</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
