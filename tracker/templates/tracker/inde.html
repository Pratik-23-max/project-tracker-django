<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project OS | Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; height: 100vh; display: flex; align-items: center; }
        .choice-card { transition: 0.3s; cursor: pointer; border: none; border-radius: 15px; }
        .choice-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .icon-circle { width: 80px; height: 80px; background: #eef2f3; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 30px; }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1 class="fw-bold mb-2">PROJECT <span class="text-primary">OS</span></h1>
        <p class="text-muted mb-5">Select your access portal to continue</p>
        
        <div class="row justify-content-center">
            <div class="col-md-4">
                <a href="/admin/" class="text-decoration-none">
                    <div class="card choice-card p-5 shadow-sm">
                        <div class="icon-circle">🔐</div>
                        <h3 class="text-dark">Administrator</h3>
                        <p class="text-muted">Manage projects, assign tasks, and view full analytics.</p>
                        <button class="btn btn-primary w-100">Login as Admin</button>
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a href="{% url 'dashboard' %}" class="text-decoration-none">
                    <div class="card choice-card p-5 shadow-sm border-primary" style="border-top: 5px solid #0d6efd;">
                        <div class="icon-circle">👨‍💻</div>
                        <h3 class="text-dark">Employee</h3>
                        <p class="text-muted">View your assigned tasks and update project progress.</p>
                        <button class="btn btn-outline-primary w-100">Enter Dashboard</button>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
