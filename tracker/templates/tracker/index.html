<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSoft | Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --clay-orange: #e67e22;
            --charcoal: #2d3436;
            --cream: #fdfbf7;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'DM Sans', sans-serif;
            background-color: var(--cream);
            color: var(--charcoal);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .header-section {
            text-align: center;
            margin-bottom: 50px;
        }

        .header-section h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--charcoal);
            margin-bottom: 10px;
        }

        .header-section span {
            color: var(--clay-orange);
        }

        .container {
            display: flex;
            gap: 30px;
            max-width: 900px;
            width: 90%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .portal-card {
            background: var(--white);
            border: 1px solid #eee;
            border-radius: 20px;
            padding: 40px;
            width: 350px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .portal-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(230, 126, 34, 0.15);
            border-color: var(--clay-orange);
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: var(--cream);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 20px;
            transition: background 0.3s;
        }

        .portal-card:hover .icon-circle {
            background: var(--clay-orange);
        }

        .portal-card h2 {
            margin: 0 0 15px 0;
            font-size: 1.5rem;
            color: var(--charcoal);
        }

        .portal-card p {
            font-size: 0.95rem;
            color: #636e72;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-enter {
            padding: 12px 25px;
            background: var(--charcoal);
            color: white;
            border-radius: 10px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: background 0.3s;
        }

        .portal-card:hover .btn-enter {
            background: var(--clay-orange);
        }

        .logout-link {
            margin-top: 40px;
            color: #b2bec3;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .logout-link:hover {
            color: var(--clay-orange);
        }
    </style>
</head>
<body>

    <div class="header-section">
        <h1>Welcome to <span>CodeSoft</span></h1>
        <p>Select a workspace to begin your session.</p>
    </div>

    <div class="container">
        <a href="{% url 'dashboard' %}" class="portal-card">
            <div class="icon-circle">💼</div>
            <h2>Manager Portal</h2>
            <p>Full access to database, project creation, and user management tools.</p>
            <div class="btn-enter">Access Admin</div>
        </a>

        <a href="{% url 'employee_dashboard' %}" class="portal-card">
            <div class="icon-circle">✍️</div>
            <h2>Employee Workspace</h2>
            <p>View your assigned projects and update your current task status.</p>
            <div class="btn-enter">Enter Dashboard</div>
        </a>
    </div>

    <a href="{% url 'logout' %}" class="logout-link">Sign Out of Account</a>

</body>
</html>
